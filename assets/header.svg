<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="glow-teal" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-indigo" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="30" cy="30" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <style>
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'SF Pro Display', Roboto, sans-serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'SF Pro Text', Roboto, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.3px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="950" height="260" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

  <!-- Grid Layer -->
  <rect width="950" height="260" rx="16" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <rect width="950" height="260" rx="16" fill="url(#glow-teal)" />
  <rect width="950" height="260" rx="16" fill="url(#glow-indigo)" />

  <!-- Top Accent Light Bar -->
  <rect x="120" y="1" width="710" height="2" fill="url(#line-grad)" />

  <!-- Content Group -->
  <g transform="translate(60, 48)">
    
    <!-- Status / Role Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="url(#badge-grad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="14" r="4.5" fill="#10b981" />
      <circle cx="16" cy="14" r="7" fill="#10b981" fill-opacity="0.3" />
      <text x="32" y="18.5" class="tag-text">UT DALLAS • M.S. COMP SCI</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="76" class="name-text">Anthony Tran</text>

    <!-- Professional Subtitle -->
    <text x="0" y="110" class="sub-text">Machine Learning Engineer &amp; Intelligent Systems Developer</text>

    <!-- Tech Pills Row -->
    <g transform="translate(0, 134)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="168" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="84" y="19.5" class="pill-text" text-anchor="middle">Machine Learning</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="138" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="69" y="19.5" class="pill-text" text-anchor="middle">Data Science</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(330, 0)">
        <rect width="170" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="85" y="19.5" class="pill-text" text-anchor="middle">Software Systems</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(512, 0)">
        <rect width="176" height="30" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="88" y="19.5" class="pill-text" text-anchor="middle">Expected Dec 2026</text>
      </g>
    </g>
  </g>

  <!-- Right Geometric Decorative Pattern -->
  <g transform="translate(770, 45)" stroke="#38bdf8" stroke-opacity="0.25" fill="none" stroke-width="1.2">
    <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" />
    <polygon points="60,20 100,43 100,97 60,120 20,97 20,43" stroke="#818cf8" stroke-opacity="0.35" />
    <circle cx="60" cy="70" r="14" fill="#06b6d4" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.5" />
    <line x1="60" y1="0" x2="60" y2="56" />
    <line x1="60" y1="84" x2="60" y2="140" />
    <line x1="0" y1="35" x2="48" y2="63" />
    <line x1="72" y1="77" x2="120" y2="105" />
    <line x1="0" y1="105" x2="48" y2="77" />
    <line x1="72" y1="63" x2="120" y2="35" />
  </g>
</svg>
